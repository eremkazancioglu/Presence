name: PresenceBadge
options:
  bundleIdPrefix: com.eremkazancioglu
  deploymentTarget:
    iOS: "17.0"

targets:
  PresenceBadge:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Presence Badge
        NSBluetoothAlwaysUsageDescription: >-
          Presence Badge scans for your bedside focus badge's Bluetooth
          broadcast to detect when you press it.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eremkazancioglu.PresenceBadge
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
