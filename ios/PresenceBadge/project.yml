name: PresenceBadge
options:
  bundleIdPrefix: com.eremkazancioglu
  deploymentTarget:
    iOS: "17.0"

targets:
  PresenceBadge:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Presence Badge
        NSLocationWhenInUseUsageDescription: >-
          Presence Badge uses Bluetooth beacon detection (via Location
          Services) to notice when you press your bedside focus badge.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Presence Badge needs "Always" location access to reliably react
          to your badge while your phone is locked or the app is in the
          background -- this is required for beacon detection to keep
          working outside the app itself. No location data is collected
          or stored.
        NSLocationTemporaryUsageDescriptionDictionary:
          BeaconRanging: >-
            Precise location is required for this app to detect your
            badge's Bluetooth beacon at all -- without it, beacon
            detection produces no results.
        UIBackgroundModes:
          - location
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.eremkazancioglu.PresenceBadge
            CFBundleURLSchemes:
              - presencebadge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eremkazancioglu.PresenceBadge
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
